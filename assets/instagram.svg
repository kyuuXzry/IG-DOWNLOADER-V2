<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FED576"/>
      <stop offset="0.3" stop-color="#F47133"/>
      <stop offset="0.6" stop-color="#BC3081"/>
      <stop offset="1" stop-color="#4C63D2"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .float { animation: float 3s ease-in-out infinite; transform-origin: 256px 256px; }
      .draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 3s ease-in-out infinite; }
      .dot { transform-origin: 351px 161px; animation: pulse 1.5s ease-in-out infinite; }
      .glow { animation: glow 3s ease-in-out infinite; transform-origin: 256px 256px; }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(-3deg); }
      }
      @keyframes draw {
        0% { stroke-dashoffset: 100; }
        50%, 85% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -100; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.5); opacity: 0.6; }
      }
      @keyframes glow {
        0%, 100% { opacity: 0.25; transform: scale(0.9); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
    </style>
  </defs>
  <rect class="glow" x="36" y="36" width="440" height="440" rx="120" fill="url(#ig)" filter="blur(0)" opacity="0.3"/>
  <g class="float">
    <rect x="56" y="56" width="400" height="400" rx="112" fill="url(#ig)"/>
    <rect class="draw" pathLength="100" x="136" y="136" width="240" height="240" rx="72" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round"/>
    <circle class="draw" pathLength="100" cx="256" cy="256" r="58" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round"/>
    <circle class="dot" cx="341" cy="171" r="18" fill="#fff"/>
  </g>
</svg>